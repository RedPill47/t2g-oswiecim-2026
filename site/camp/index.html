<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camp explorer – Oświęcim 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<style>
:root{
  --paper:#E2DBC8; --sheet:#EAE4D3; --ink:#26241F; --pencil:#6B6557;
  --rule:#B5AB93; --red:#953122; --blue:#2D486A;
  --type:"Special Elite","Courier New",Courier,monospace;
  --serif:"Crimson Pro",Georgia,"Times New Roman",serif;
  color-scheme:light;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1B1C1A; --sheet:#242522; --ink:#DAD4C3; --pencil:#9C9684;
    --rule:#46463F; --red:#D47561; --blue:#93ADCC; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1B1C1A; --sheet:#242522; --ink:#DAD4C3; --pencil:#9C9684;
  --rule:#46463F; --red:#D47561; --blue:#93ADCC; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.55;overflow:hidden;overscroll-behavior:none;
  background-image:radial-gradient(rgba(120,100,60,.06) 1px,transparent 1px);background-size:5px 5px}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column}
a{color:var(--blue)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px dashed var(--red);outline-offset:3px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px;overflow-wrap:break-word}
@media (max-width:480px){html[lang="de"] .wrap{hyphens:auto}}

.bar{flex:none;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;border-bottom:1px solid var(--rule);background:var(--paper)}
.row1{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.back{flex:none;font-family:var(--type);font-size:22px;line-height:1;text-decoration:none;padding:4px 6px 4px 0}
h1{flex:1 1 auto;min-width:0;font-family:var(--type);font-weight:400;font-size:clamp(18px,5vw,24px);line-height:1.1;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uilang{flex:none;display:flex;flex-wrap:nowrap;gap:4px}
.uilang button{flex:none;font-family:var(--type);font-size:13px;background:transparent;border:1px solid var(--rule);color:var(--pencil);padding:3px 7px;border-radius:2px;cursor:pointer}
.uilang button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.sites{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sites button{font-family:var(--type);font-size:14px;line-height:1.15;background:var(--sheet);border:1px solid var(--rule);padding:7px 6px;cursor:pointer;border-radius:2px}
.sites button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lede{margin:0 0 8px}
.respect{font-family:var(--type);font-size:14px;color:var(--pencil);border-left:3px solid var(--red);padding:4px 0 4px 12px;margin:10px 0 14px}

.main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;--map:52%}
.stage{flex:0 0 var(--map);min-height:0;display:flex;flex-direction:column;background:var(--paper);transition:flex-basis .28s cubic-bezier(.2,.8,.2,1)}
.main.dragging .stage{transition:none}
.view{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;touch-action:none;background:#cfc7b0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .view{background:#151614}}
.stage canvas{display:block;width:100%;height:100%}
.pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;display:flex;align-items:center;gap:6px;
  font-family:var(--type);font-size:13px;line-height:1;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);border-radius:14px;padding:5px 8px;cursor:pointer;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.pin .tt{display:none;max-width:52vw;overflow:hidden;text-overflow:ellipsis}
.pin.on{background:var(--red);border-color:var(--red);color:#fff;z-index:2}
.pin.on .tt{display:inline}
.pin.sector{background:transparent;border:0;box-shadow:none;color:var(--ink);opacity:.7;font-size:12px;pointer-events:none;transform:translate(-50%,-50%)}
.ctrls{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:8px}
.ctrls button{width:38px;height:38px;display:flex;align-items:center;justify-content:center;padding:0;background:var(--paper);color:var(--ink);border:1px solid var(--ink);border-radius:50%;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.ctrls button.txt{font-family:var(--type);font-size:14px}
.ctrls button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.ctrls button[hidden]{display:none}
.ctrls svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.toast{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 60px);font-family:var(--type);font-size:13px;background:var(--paper);border:1px solid var(--rule);padding:4px 8px;border-radius:2px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.era{flex:none;display:flex;align-items:center;gap:10px;padding:4px 12px;border-top:1px solid var(--rule);background:var(--sheet);font-family:var(--type);font-size:13px;white-space:nowrap}
.era[hidden]{display:none}
.era input{flex:1 1 auto;min-width:0;accent-color:var(--red);margin:0;height:28px}
.cap{flex:none;display:block;width:100%;text-align:left;border:0;user-select:none;border-top:1px solid var(--rule);background:var(--sheet);color:var(--pencil);font-family:var(--type);font-size:12px;line-height:1.4;padding:4px 12px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap[hidden]{display:none}
.cap[aria-expanded="true"]{white-space:normal;max-height:30svh;overflow:auto}
.cap a{color:var(--blue)}
.nogl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-family:var(--type);font-size:15px;color:var(--pencil)}

.panel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--paper);border-top:1px solid var(--rule);box-shadow:0 -3px 10px rgba(0,0,0,.12);position:relative;z-index:2}
.grip{flex:none;touch-action:none;cursor:grab;padding:4px 12px 6px;user-select:none;-webkit-user-select:none}
.main.dragging .grip{cursor:grabbing}
.knob{display:block;width:46px;height:5px;border-radius:3px;background:var(--rule);margin:2px auto 6px}
.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:4px 16px calc(28px + env(safe-area-inset-bottom,0px));overflow-wrap:break-word}
@media (max-width:480px){html[lang="de"] .scroll{hyphens:auto}}
.tour{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tour button{font-family:var(--type);font-size:20px;line-height:1;width:52px;height:40px;background:var(--sheet);border:1px solid var(--ink);border-radius:2px;cursor:pointer;touch-action:manipulation}
.tour button:disabled{opacity:.35;cursor:default}
.tour .n{font-family:var(--type);font-size:15px;color:var(--pencil);text-align:center}
.card{background:var(--sheet);border:1px solid var(--rule);padding:16px 16px 12px;margin:0 0 24px;box-shadow:2px 3px 0 rgba(0,0,0,.08)}
.card h2{font-family:var(--type);font-weight:400;font-size:24px;line-height:1.15;margin:0 0 8px}
.kind{display:inline-block;font-family:var(--type);font-size:12.5px;border:1.5px solid var(--pencil);color:var(--pencil);padding:0 6px;margin:0 0 10px;transform:rotate(-2deg)}
.kind.recon,.kind.ruin{border-color:var(--red);color:var(--red)}
.card h3{font-family:var(--type);font-weight:400;font-size:14px;color:var(--pencil);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 2px}
.card p{margin:0 0 8px}
.person{border-left:3px solid var(--blue);padding-left:12px;margin:8px 0}
.person b{font-weight:600}
.src{font-size:15px;color:var(--pencil);margin-top:10px}
.src a{word-break:break-word}
.start{font-family:var(--type);font-size:15px;background:var(--ink);color:var(--paper);border:0;padding:10px 14px;border-radius:2px;cursor:pointer;margin-top:6px}
h2.sec{font-family:var(--type);font-weight:400;font-size:22px;margin:28px 0 8px}
ol.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
ol.list button{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:10px 0;cursor:pointer;font-family:var(--serif);font-size:17px;line-height:1.3}
ol.list .num{font-family:var(--type);color:var(--red)}
ol.list button[aria-current="true"]{background:var(--sheet)}
.links{padding-left:20px}
.credits{font-family:var(--type);font-size:13px;color:var(--pencil);margin:28px 0 40px;border-top:1px solid var(--rule);padding-top:10px}

@media (min-width:900px){
  .bar{display:flex;align-items:center;gap:20px}
  .row1{flex:1 1 auto;margin:0}
  .sites{flex:0 0 440px}
  .main{flex-direction:row}
  .stage{flex:1 1 auto;transition:none}
  .panel{flex:0 0 min(42%,560px);border-top:0;border-left:1px solid var(--rule);box-shadow:-3px 0 10px rgba(0,0,0,.08)}
  .knob{display:none}
  .grip{cursor:default;padding:10px 20px 8px}
  .scroll{padding:4px 22px 28px}
  .cap{white-space:normal}
}
@media (prefers-reduced-motion:reduce){.toast,.stage{transition:none}}
</style>
</head>
<body>
<div class="app">
<header class="bar">
  <div class="row1">
    <a class="back" href="../" id="back" data-a="back">←</a>
    <h1 data-t="h1">Camp explorer</h1>
    <div class="uilang" id="uilang" role="group" aria-label="Page language">
      <button data-ui="lb" lang="lb" title="Lëtzebuergesch" aria-label="Lëtzebuergesch">LB</button><button data-ui="de" lang="de" title="Deutsch" aria-label="Deutsch">DE</button><button data-ui="fr" lang="fr" title="Français" aria-label="Français">FR</button><button data-ui="en" lang="en" title="English" aria-label="English">EN</button>
    </div>
  </div>
  <div class="sites" id="sites">
    <button data-site="a1" aria-pressed="false"></button><button data-site="bk" aria-pressed="false"></button>
  </div>
</header>
<div class="main">
  <div class="stage" id="stage">
    <div class="view" id="view">
      <canvas id="c" aria-label="3D map"></canvas>
      <div class="pins" id="pins"></div>
      <div class="ctrls">
        <button id="v-mode" class="txt" data-a="mode">2D</button>
        <button id="recon" aria-pressed="false" data-a="recon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg></button>
        <button id="locate" aria-pressed="false" data-a="locate"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
        <button id="whole" data-a="whole"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div class="toast" id="toast" role="status"></div>
    </div>
    <div class="era"><span>1944</span><input type="range" id="era" min="0" max="100" step="1" value="100"><span data-t="ynow">Today</span></div>
    <div class="cap" id="cap" hidden role="button" tabindex="0" aria-expanded="false"></div>
  </div>
  <div class="panel" id="panel">
    <div class="grip" id="grip">
      <span class="knob" aria-hidden="true"></span>
      <div class="tour">
        <button id="prev" aria-label="Previous">‹</button>
        <span class="n" id="stopn"></span>
        <button id="next" aria-label="Next">›</button>
      </div>
    </div>
    <div class="scroll" id="scroll">
    <article class="card" id="card" aria-live="polite"></article>
    <h2 class="sec" data-t="all">All places</h2>
    <ol class="list" id="list"></ol>
    <h2 class="sec" data-t="further">Go further</h2>
    <ul class="links" id="links"></ul>
    <p class="credits" data-t="credits">Map data © OpenStreetMap contributors (ODbL). 3D: three.js (MIT). Texts: unofficial, checked against the Auschwitz Memorial’s history pages; sources are given for each place.</p>
    </div>
  </div>
</div>
</div>
<script type="module" src="camp.js"></script>
</body>
</html>
